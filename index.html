<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense &amp; Budget Visualizer</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

  <!-- Header -->
  <header class="app-header">
    <h1>Expense &amp; Budget Visualizer</h1>
    <button id="theme-toggle" class="btn-icon" aria-label="Toggle dark/light mode">🌙</button>
  </header>

  <main class="container">

    <!-- Total Balance -->
    <section class="card balance-card" aria-label="Total Balance">
      <p class="balance-label">TOTAL BALANCE</p>
      <p class="balance-amount" id="total-balance">$0.00</p>
    </section>

    <!-- Spending Limit -->
    <section class="card limit-card">
      <div class="limit-row">
        <label for="spending-limit">Spending Limit ($):</label>
        <input type="number" id="spending-limit" placeholder="e.g. 100" min="0" step="0.01" />
        <button id="set-limit-btn" class="btn btn-secondary">Set</button>
        <button id="clear-limit-btn" class="btn btn-ghost">Clear</button>
      </div>
      <p id="limit-status" class="limit-status" aria-live="polite"></p>
    </section>

    <!-- Add Transaction Form -->
    <section class="card form-card">
      <h2>Add Transaction</h2>
      <form id="transaction-form" novalidate>
        <div class="form-group">
          <label for="item-name">Item Name</label>
          <input type="text" id="item-name" placeholder="e.g. Lunch" autocomplete="off" />
          <span class="error-msg" id="name-error"></span>
        </div>
        <div class="form-group">
          <label for="item-amount">Amount</label>
          <input type="number" id="item-amount" placeholder="e.g. 14.99" min="0.01" step="0.01" />
          <span class="error-msg" id="amount-error"></span>
        </div>
        <div class="form-group">
          <label for="item-category">Category</label>
          <select id="item-category">
            <option value="">-- Select Category --</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Fun">Fun</option>
          </select>
          <span class="error-msg" id="category-error"></span>
        </div>
        <button type="submit" class="btn btn-primary btn-full">Add Transaction</button>
      </form>
    </section>

    <!-- Bottom grid: Transaction list + Chart -->
    <div class="bottom-grid">

      <!-- Transaction List -->
      <section class="card list-card">
        <div class="list-header">
          <h2>Transactions</h2>
          <div class="sort-controls">
            <label for="sort-select">Sort by:</label>
            <select id="sort-select">
              <option value="newest">Newest</option>
              <option value="oldest">Oldest</option>
              <option value="amount-asc">Amount ↑</option>
              <option value="amount-desc">Amount ↓</option>
              <option value="category">Category</option>
            </select>
          </div>
        </div>
        <ul id="transaction-list" class="transaction-list" aria-label="Transaction list">
          <li class="empty-state" id="empty-state">No transactions yet. Add one above!</li>
        </ul>
      </section>

      <!-- Pie Chart -->
      <section class="card chart-card">
        <h2>Spending by Category</h2>
        <div class="chart-wrapper">
          <canvas id="spending-chart" aria-label="Spending distribution pie chart" role="img"></canvas>
          <p class="chart-empty" id="chart-empty">No data to display yet.</p>
        </div>
      </section>

    </div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
